<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Gemini Spring Boot</title>
    <!-- Librería ligera para renderizar Markdown de forma segura -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 750px;
            height: 90vh;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background-color: #1a73e8;
            color: #ffffff;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .btn-clear {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        .btn-clear:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-message {
            align-self: flex-end;
            background-color: #1a73e8;
            color: #ffffff;
            border-bottom-right-radius: 2px;
            white-space: pre-wrap;
        }

        .bot-message {
            align-self: flex-start;
            background-color: #f8f9fa;
            color: #212529;
            border: 1px solid #e9ecef;
            border-bottom-left-radius: 2px;
        }

        /* Estilos para renderizado Markdown */
        .bot-message pre {
            background-color: #212529;
            color: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 8px 0;
            font-family: monospace;
            font-size: 13px;
        }

        .bot-message code {
            font-family: monospace;
            background-color: #e9ecef;
            color: #d63384;
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 13px;
        }

        .bot-message pre code {
            color: inherit;
            background: none;
            padding: 0;
        }

        .bot-message ul, .bot-message ol {
            margin-left: 20px;
            margin-top: 6px;
            margin-bottom: 6px;
        }

        .bot-message p {
            margin-bottom: 8px;
        }

        .bot-message p:last-child {
            margin-bottom: 0;
        }

        /* Indicador de carga visible y robusto */
        .typing-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 12px 18px;
            background: #e9ecef;
            border-radius: 12px;
            border-bottom-left-radius: 2px;
            align-self: flex-start;
            color: #495057;
            font-size: 13px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #1a73e8;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.2s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.30s; }
        .dot:nth-child(2) { animation-delay: -0.15s; }
        .dot:nth-child(3) { animation-delay: 0s; }

        @keyframes pulse {
            0%, 80%, 100% {
                opacity: 0.3;
                transform: scale(0.8);
            }
            40% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
            padding: 16px;
            border-top: 1px solid #dee2e6;
            background: #ffffff;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ced4da;
            border-radius: 24px;
            outline: none;
            font-size: 14px;
        }

        input[type="text"]:focus {
            border-color: #1a73e8;
        }

        button.btn-send {
            background-color: #1a73e8;
            color: #ffffff;
            border: none;
            padding: 0 22px;
            border-radius: 24px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-send:hover {
            background-color: #1557b0;
        }

        button:disabled, input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <header class="chat-header">
        <h1>Asistente Gemini</h1>
        <button class="btn-clear" id="btnLimpiar" onclick="limpiarChat()">Limpiar</button>
    </header>

    <div class="chat-messages" id="chatMessages">
        <div class="message bot-message">¡Hola! ¿En qué puedo ayudarte hoy?</div>
    </div>

    <form class="chat-input-area" id="chatForm" onsubmit="enviarMensaje(event)">
        <input type="text" id="mensajeInput" placeholder="Escribe un mensaje..." autocomplete="off">
        <button type="submit" class="btn-send" id="btnEnviar">Enviar</button>
    </form>
</div>

<script>
    const chatMessages = document.getElementById('chatMessages');
    const mensajeInput = document.getElementById('mensajeInput');
    const btnEnviar = document.getElementById('btnEnviar');
    const btnLimpiar = document.getElementById('btnLimpiar');

    function scrollAlFondo() {
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function agregarMensajeUsuario(texto) {
        const div = document.createElement('div');
        div.classList.add('message', 'user-message');
        div.textContent = texto;
        chatMessages.appendChild(div);
        scrollAlFondo();
    }

    function agregarMensajeBot(markdownTexto) {
        const div = document.createElement('div');
        div.classList.add('message', 'bot-message');
        div.innerHTML = marked.parse(markdownTexto || '');
        chatMessages.appendChild(div);
        scrollAlFondo();
        return div;
    }

    function mostrarIndicadorCarga() {
        const indicador = document.createElement('div');
        indicador.id = 'indicadorCarga';
        indicador.classList.add('typing-indicator');
        indicador.innerHTML = '<span>Pensando</span> <div class="dot"></div><div class="dot"></div><div class="dot"></div>';
        chatMessages.appendChild(indicador);
        scrollAlFondo();
    }

    function removerIndicadorCarga() {
        const indicador = document.getElementById('indicadorCarga');
        if (indicador) indicador.remove();
    }

    function bloquearControles(bloquear) {
        mensajeInput.disabled = bloquear;
        btnEnviar.disabled = bloquear;
        btnLimpiar.disabled = bloquear;
    }

    async function enviarMensaje(e) {
        e.preventDefault();
        const texto = mensajeInput.value.trim();
        if (!texto) return;

        agregarMensajeUsuario(texto);
        mensajeInput.value = '';
        bloquearControles(true);
        mostrarIndicadorCarga();

        try {
            const res = await fetch('/api/chat/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mensaje: texto })
            });

            removerIndicadorCarga();

            if (!res.ok) {
                const errorTexto = await res.text();
                agregarMensajeBot('**Aviso:** ' + (errorTexto || 'Error HTTP ' + res.status));
                return;
            }

            // Creamos la burbuja vacía y recogemos el div devuelto
            const divBot = agregarMensajeBot('');

            const reader = res.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let textoAcumulado = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                textoAcumulado += chunk;

                // Actualiza el markdown y hace scroll continuo
                divBot.innerHTML = marked.parse(textoAcumulado);
                scrollAlFondo();
            }

        } catch (err) {
            removerIndicadorCarga();
            agregarMensajeBot('**Error:** No se pudo completar la transmisión con el backend.');
            console.error(err);
        } finally {
            bloquearControles(false);
            mensajeInput.focus();
        }
    }

    async function limpiarChat() {
        bloquearControles(true);
        try {
            await fetch('/api/chat/limpiar', { method: 'POST' });
            chatMessages.innerHTML = '<div class="message bot-message">Conversación reiniciada. ¿En qué puedo ayudarte?</div>';
        } catch (err) {
            console.error('Error al limpiar:', err);
        } finally {
            bloquearControles(false);
            mensajeInput.focus();
        }
    }
</script>

</body>
</html>
